<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0e10"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a2c"/>
      <stop offset="1" stop-color="#ffb38a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6a2c" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff6a2c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="930" cy="170" r="260" fill="url(#glow)"/>
  <circle cx="200" cy="640" r="220" fill="url(#glow)" opacity=".6"/>

  <!-- Browser window: the school portal being recorded -->
  <g transform="translate(90 90)">
    <rect width="640" height="430" rx="14" fill="#141416" stroke="#ff6a2c" stroke-opacity=".6" stroke-width="2"/>
    <rect width="640" height="44" rx="14" fill="#1f1f23"/>
    <rect y="30" width="640" height="14" fill="#1f1f23"/>
    <circle cx="26" cy="22" r="7" fill="#f87171"/>
    <circle cx="50" cy="22" r="7" fill="#fbbf24"/>
    <circle cx="74" cy="22" r="7" fill="#34d399"/>
    <rect x="110" y="11" width="400" height="22" rx="11" fill="#0b0b0c"/>
    <text x="126" y="27" fill="#9a9a9f" font-size="13">portal / admin / timetable</text>
    <circle cx="590" cy="22" r="8" fill="#ef4444"/>
    <text x="604" y="27" fill="#fca5a5" font-size="12" font-weight="700">REC</text>

    <!-- sidebar -->
    <rect x="20" y="64" width="130" height="346" rx="8" fill="#1b1b1f"/>
    <rect x="34" y="84" width="100" height="12" rx="6" fill="#ff6a2c" opacity=".8"/>
    <rect x="34" y="112" width="84" height="10" rx="5" fill="#34343a"/>
    <rect x="34" y="136" width="94" height="10" rx="5" fill="#34343a"/>
    <rect x="34" y="160" width="74" height="10" rx="5" fill="#34343a"/>
    <rect x="34" y="184" width="88" height="10" rx="5" fill="#34343a"/>

    <!-- content: table -->
    <rect x="170" y="64" width="450" height="30" rx="6" fill="#26262b"/>
    <g fill="#202024">
      <rect x="170" y="104" width="450" height="26" rx="5"/>
      <rect x="170" y="138" width="450" height="26" rx="5"/>
      <rect x="170" y="172" width="450" height="26" rx="5"/>
      <rect x="170" y="206" width="450" height="26" rx="5"/>
    </g>
    <rect x="170" y="138" width="450" height="26" rx="5" fill="none" stroke="#ffb38a" stroke-width="2" stroke-dasharray="6 5"/>

    <!-- form input being typed -->
    <rect x="170" y="258" width="300" height="38" rx="8" fill="#0b0b0c" stroke="#ff6a2c" stroke-width="2"/>
    <text x="186" y="283" fill="#e6e6e3" font-size="15">Grade 7, Period 3|</text>
    <rect x="486" y="258" width="134" height="38" rx="8" fill="#ff6a2c"/>
    <text x="553" y="283" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Save</text>

    <!-- cursor + click ripple -->
    <circle cx="548" cy="278" r="22" fill="none" stroke="#ffb38a" stroke-width="2" opacity=".7"/>
    <circle cx="548" cy="278" r="34" fill="none" stroke="#ffb38a" stroke-width="1.5" opacity=".35"/>
    <path d="M548 278 l0 30 l8 -8 l7 15 l6 -3 l-7 -14 l11 0 z" fill="#fff" stroke="#0b0b0c" stroke-width="1.5"/>

    <!-- event stream -->
    <g font-size="12" font-family="Consolas, Menlo, monospace" fill="#ffd2b8">
      <text x="170" y="330">{"type":3,"source":2,"x":548,"y":278}   // click</text>
      <text x="170" y="350">{"type":3,"source":5,"text":"Grade 7…"}  // input</text>
      <text x="170" y="370">{"type":3,"source":0,"adds":[…]}      // DOM mutation</text>
    </g>
  </g>

  <!-- Pipeline: chunks → Node → S3 -->
  <g transform="translate(790 110)">
    <text x="0" y="0" fill="#ffb38a" font-size="15" font-weight="700" letter-spacing="2">EVENTS, NOT VIDEO</text>

    <g transform="translate(0 30)">
      <rect width="300" height="64" rx="10" fill="#1b1b1f" stroke="#ff6a2c" stroke-opacity=".5"/>
      <text x="18" y="28" fill="#fff" font-size="17" font-weight="700">rrweb recorder</text>
      <text x="18" y="50" fill="#9a9a9f" font-size="13">chunked every few seconds · retries</text>
    </g>
    <path d="M150 100 v26" stroke="url(#accent)" stroke-width="3"/>
    <path d="M142 118 l8 10 l8 -10" fill="none" stroke="#ffb38a" stroke-width="3"/>

    <g transform="translate(0 134)">
      <rect width="300" height="64" rx="10" fill="#1b1b1f" stroke="#ff6a2c" stroke-opacity=".5"/>
      <text x="18" y="28" fill="#fff" font-size="17" font-weight="700">Node.js ingest API</text>
      <text x="18" y="50" fill="#9a9a9f" font-size="13">size guard · rate limit · gzip</text>
    </g>
    <path d="M150 204 v26" stroke="url(#accent)" stroke-width="3"/>
    <path d="M142 222 l8 10 l8 -10" fill="none" stroke="#ffb38a" stroke-width="3"/>

    <g transform="translate(0 238)">
      <rect width="300" height="64" rx="10" fill="#1b1b1f" stroke="#ffb38a" stroke-opacity=".6"/>
      <text x="18" y="28" fill="#fff" font-size="17" font-weight="700">AWS S3 + tenant DB</text>
      <text x="18" y="50" fill="#9a9a9f" font-size="13">.json.gz chunks · 30-day retention</text>
    </g>

    <g transform="translate(0 322)">
      <rect x="0" width="44" height="30" rx="5" fill="#ff6a2c" opacity=".9"/>
      <rect x="52" width="44" height="30" rx="5" fill="#ff6a2c" opacity=".75"/>
      <rect x="104" width="44" height="30" rx="5" fill="#ff6a2c" opacity=".6"/>
      <rect x="156" width="44" height="30" rx="5" fill="#ff6a2c" opacity=".45"/>
      <rect x="208" width="44" height="30" rx="5" fill="#ff6a2c" opacity=".3"/>
      <text x="0" y="52" fill="#9a9a9f" font-size="12">gzip: 85–93% smaller</text>
    </g>
  </g>

  <!-- Replay player bar -->
  <g transform="translate(90 580)">
    <rect width="1020" height="90" rx="14" fill="#141416" stroke="#ff6a2c" stroke-opacity=".6" stroke-width="2"/>
    <circle cx="52" cy="45" r="26" fill="url(#accent)"/>
    <path d="M44 32 l20 13 l-20 13 z" fill="#fff"/>
    <rect x="100" y="40" width="760" height="10" rx="5" fill="#26262b"/>
    <rect x="100" y="40" width="470" height="10" rx="5" fill="url(#accent)"/>
    <circle cx="570" cy="45" r="11" fill="#fff"/>
    <g fill="#ffb38a">
      <rect x="180" y="30" width="3" height="6" rx="1"/>
      <rect x="260" y="30" width="3" height="6" rx="1"/>
      <rect x="340" y="30" width="3" height="6" rx="1"/>
      <rect x="455" y="30" width="3" height="6" rx="1"/>
      <rect x="690" y="30" width="3" height="6" rx="1"/>
      <rect x="780" y="30" width="3" height="6" rx="1"/>
    </g>
    <text x="100" y="74" fill="#9a9a9f" font-size="13">06:12 / 10:04</text>
    <rect x="884" y="26" width="116" height="38" rx="8" fill="none" stroke="#ffb38a" stroke-width="2"/>
    <path d="M906 36 v14 M900 44 l6 6 l6 -6 M898 54 h16" fill="none" stroke="#ffb38a" stroke-width="2" stroke-linecap="round"/>
    <text x="924" y="50" fill="#ffd2b8" font-size="13" font-weight="700">.html</text>
  </g>
</svg>
